<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手指取景框 · 实时 AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a0a0c;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }
    video { display: none; }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      background: #0a0a0c;
      z-index: 10;
      transition: opacity 0.4s;
      text-align: center;
      padding: 24px;
    }
    #status.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #333;
      border-top-color: #eee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed;
      left: 0; right: 0;
      bottom: 126px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.4s;
      z-index: 5;
      animation: hint-float 3.2s ease-in-out infinite;
    }
    #hint.hidden { opacity: 0; }
    #hint-text {
      font-size: 15px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      animation: hint-pulse 2.4s ease-in-out infinite;
    }
    @keyframes hint-pulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes hint-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    #live-pill {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 7;
      display: none;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(20,20,24,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
    }
    #live-pill.on { display: inline-flex; }
    #live-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80;
      animation: hint-pulse 1.6s ease-in-out infinite;
    }
    #live-pill.connecting .dot { background: #ffc24b; }
    #live-pill.error .dot { background: #ff6b5e; animation: none; }

    #key-btn, #lang-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 7;
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(20,20,24,0.72);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      font-size: 18px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #lang-btn {
      right: 68px;
      min-width: 44px;
      color: #eee;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 9px;
    }
    #key-btn:hover, #lang-btn:hover { background: rgba(255,255,255,0.1); }

    #key-panel {
      position: fixed;
      top: 64px;
      right: 16px;
      width: 330px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      z-index: 8;
      background: rgba(24,24,30,0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 18px;
      transition: opacity 0.2s, transform 0.2s;
    }
    #key-panel.hidden {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }
    #key-panel h3 { font-size: 15px; margin-bottom: 8px; }
    #key-panel p { font-size: 12.5px; color: rgba(255,255,255,0.7); line-height: 1.5; margin-bottom: 10px; }
    #key-panel a { color: #8ab4ff; }
    #key-panel input[type="password"], #key-panel textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.35);
      color: #eee;
      font-size: 13px;
      margin-bottom: 10px;
      font-family: ui-monospace, monospace;
      resize: vertical;
    }
    #key-panel textarea { font-family: inherit; }
    #key-panel .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 12px;
      cursor: pointer;
    }
    #key-panel .row { display: flex; gap: 8px; margin-bottom: 10px; }
    #key-panel .row button {
      flex: 1;
      appearance: none;
      border: none;
      border-radius: 9px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    #key-save { background: #fff; color: #111; }
    #key-clear { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    #key-panel .note { font-size: 11.5px; color: rgba(255,255,255,0.45); margin-bottom: 0; }
    #character-file { display: none; }

    #toolbar {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 24px);
      gap: 8px;
      padding: 8px;
      background: rgba(20,20,24,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      z-index: 6;
    }
    #toolbar button {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.08); }
    #toolbar button.active {
      background: #fff;
      color: #111;
    }
    #toolbar button .key {
      opacity: 0.5;
      font-weight: 400;
      margin-right: 5px;
      font-size: 11px;
    }
    #character-thumb-toolbar {
      display: none;
      width: 24px; height: 24px;
      margin-left: 7px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.55);
    }
    #character-thumb-toolbar.visible { display: inline-block; }
    #display-mode {
      position: fixed;
      left: 50%; bottom: 78px;
      transform: translateX(-50%);
      z-index: 6;
      display: flex; align-items: center; gap: 9px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      background: rgba(20,20,24,.72);
      backdrop-filter: blur(12px);
      color: rgba(255,255,255,.82);
      font-size: 12.5px;
      white-space: nowrap;
    }
    #inside-replacement { position: absolute; opacity: 0; pointer-events: none; }
    .switch-track {
      width: 36px; height: 20px; padding: 2px;
      border-radius: 999px;
      background: rgba(255,255,255,.2);
      transition: background .18s;
      cursor: pointer;
    }
    .switch-knob {
      display: block; width: 16px; height: 16px;
      border-radius: 50%; background: #fff;
      transition: transform .18s;
    }
    #inside-replacement:checked + .switch-track { background: #4ade80; }
    #inside-replacement:checked + .switch-track .switch-knob { transform: translateX(16px); }
  </style>
</head>
<body>
  <div id="status">
    <div class="spinner"></div>
    <div id="status-text">正在加载手部追踪…</div>
  </div>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <video id="lucy" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="hint">
    <div id="hint-text">双手抬起，伸出拇指和食指，框出你的画面 🎬</div>
  </div>

  <div id="live-pill"><span class="dot"></span><span id="live-text">实时</span></div>

  <div id="toolbar"></div>
  <input id="character-file" type="file" accept="image/jpeg,image/png,image/webp" />

  <label id="display-mode">
    <span id="display-mode-label">框内显示替换画面</span>
    <input id="inside-replacement" type="checkbox" checked />
    <span class="switch-track"><span class="switch-knob"></span></span>
  </label>

  <button id="lang-btn" title="Switch to English">EN</button>
  <button id="key-btn" title="Decart API 密钥">🔑</button>
  <div id="key-panel" class="hidden">
    <h3 id="key-heading">Decart API 密钥</h3>
    <p id="key-description">
      取景框中会显示由
      <a href="https://docs.platform.decart.ai/models/realtime/lucy-2.5" target="_blank" rel="noopener">Decart Lucy 2.5</a> 实时生成的 <strong>AI 画面</strong>
      （通过 WebRTC 以 30fps 实时转换视频）。请前往
      <a href="https://platform.decart.ai/" target="_blank" rel="noopener">platform.decart.ai</a>。
    </p>
    <input id="key-input" type="password" placeholder="输入 Decart API 密钥" autocomplete="off" />
    <label class="remember">
      <input type="checkbox" id="key-remember" /> <span id="remember-label">在此设备上记住密钥</span>
    </label>
    <h3 id="custom-heading">自定义风格</h3>
    <textarea id="style-custom" rows="3"
      placeholder="用于“自定义”效果。请描述希望人物或画面变成的样子。"></textarea>
    <div class="row">
      <button id="key-save">保存并连接</button>
      <button id="key-clear">清除</button>
    </div>
    <p class="note" id="key-note">
      密钥仅保存在当前浏览器中，并只用于连接 Decart 的 WebRTC 会话。没有密钥时，将使用本地颜色滤镜作为预览。
    </p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
